# =============================================
#  AMV Solar ? application.properties
# =============================================

spring.application.name=amv-solar

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Banco H2 (dev) ---
spring.datasource.url=jdbc:h2:mem:amvsolardb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- E-mail (configure com suas credenciais) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:contato@amvsolar.com.br}
spring.mail.password=${MAIL_PASSWORD:sua_senha_de_app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Dados do site ---
amvsolar.whatsapp=5537999999999
amvsolar.email=contato@amvsolar.com.br
amvsolar.instagram=https://www.instagram.com/amv_solar/
amvsolar.cidade=Jacutinga, MG

# --- Servidor ---
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true